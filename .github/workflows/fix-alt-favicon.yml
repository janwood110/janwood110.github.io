name: Fix hero alt and favicon links
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-alt-favicon.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only hero alt and favicon markup
        shell: python
        run: |
          from pathlib import Path
          import re
          names=['حسین عطار جاننثار نوبری','حسین عطار جان‌نثار نوبری','حسین عطار جان نثار نوبری','حسین عطار جانثار نوبری','حسین عطار جان‌ثار نوبری','حسین عطار جانسار نوبری','حسین عطار جان‌سار نوبری','حسین عطار جاننسار نوبری','حسین عطار جان‌نسار نوبری','حسین جاننثار نوبری','حسین جان‌نثار نوبری','حسین جان نثار نوبری','حسین جانثار نوبری','حسین جان‌ثار نوبری','حسین جانسار نوبری','حسین جان‌سار نوبری','حسین جاننسار نوبری','حسین جان‌نسار نوبری','حسین جان نسار نوبری','حسین جاننثار','حسین جان‌نثار','حسین جان نثار','حسین جانثار','حسین جان‌ثار','حسین جانسار','حسین جان‌سار','حسین جاننسار','حسین جان‌نسار','حسین جان نسار','حسین عطار','حسین عطارجان','حسین عطار جان','حسین نوبری','Hossein Attar Jannesar Nobari','Hossein Attar Janesar Nobari']
          fs=sorted(Path('articles').glob('*/index.html'))
          if len(fs)!=50: raise SystemExit(f'Expected 50 articles, got {len(fs)}')
          for i,p in enumerate(fs):
              s=p.read_text(encoding='utf-8')
              num=p.parent.name[:2]
              fav=Path(f'assets/favicons/{num}.png')
              if not fav.exists(): raise SystemExit(f'Missing favicon {fav}')
              # hero alt only; do not alter image src/name
              pat=r'(<section class="hero"[^>]*>\s*<img\s+src="[^"]+"\s+)alt="[^"]*"'
              s,n=re.subn(pat,lambda m:m.group(1)+f'alt="{names[i%len(names)]}"',s,count=1)
              if n!=1: raise SystemExit(f'Hero not uniquely found: {p}')
              # use root-absolute favicon URL and common icon declarations
              favblock=(f'<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicons/{num}.png">'
                        f'<link rel="shortcut icon" type="image/png" href="/assets/favicons/{num}.png">'
                        f'<link rel="apple-touch-icon" href="/assets/favicons/{num}.png">')
              s,n=re.subn(r'<link rel="icon"[^>]*href="[^"]+">(?:\s*<link rel="shortcut icon"[^>]*>)?(?:\s*<link rel="apple-touch-icon"[^>]*>)?',favblock,s,count=1)
              if n!=1: raise SystemExit(f'Favicon tag not uniquely found: {p}')
              p.write_text(s,encoding='utf-8')
          print('updated 50 articles')
      - name: Verify without changing image paths
        shell: python
        run: |
          from pathlib import Path
          import re
          fs=sorted(Path('articles').glob('*/index.html'))
          assert len(fs)==50
          for p in fs:
              s=p.read_text(encoding='utf-8'); num=p.parent.name[:2]
              assert re.search(r'<section class="hero"[^>]*>\s*<img[^>]*\salt="[^"]+"',s),p
              assert f'href="/assets/favicons/{num}.png"' in s,p
              assert Path(f'assets/favicons/{num}.png').exists(),p
          print('verified alt + favicon files/links on all 50')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/*/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Set hero alt text and repair favicon declarations on 50 articles"
          git push
